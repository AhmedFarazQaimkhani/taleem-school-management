services:
  db:
    image: postgres:16-alpine
    container_name: taleem-postgres
    environment:
      POSTGRES_USER: taleem
      POSTGRES_PASSWORD: taleem
      POSTGRES_DB: taleem
    ports:
      - "5432:5432"
    volumes:
      - taleem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taleem -d taleem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taleem_pg:
